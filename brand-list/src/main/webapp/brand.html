<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>品牌列表</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <label>
        <input type="button" value="添加品牌" style="background-color: #167f92;margin-bottom: 10px" id="addButton"/>
        <hr>
        <table id="brandTable" class="responseTable"></table>
    </label>
</div>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script>
    window.onload = function (){
        getBrandList()
    }
    function getBrandList(){
        axios({
            method:"get",
            url:"http://localhost:8080/brand"
        }).then(function (resp){
            let brands = resp.data;
            let tableData = `<tr>
                <th>序号</th>
                <th>品牌名称</th>
                <th>企业名称</th>
                <th>排序</th>
                <th>品牌介绍</th>
                <th>操作</th>
                </tr>`;

            for (let i = 0;i<brands.length;i++){
                let brand = brands[i];
                tableData += `
                <tr data-id="${brand.id}">
                <td>${brand.id}</td>
                <td>${brand.companyName}</td>
                <td>${brand.brandName}</td>
                <td>${brand.ordered}</td>
                <td>${brand.description}</td>
                <td><button onclick="deleteBrand(${brand.id})"
                style="border: 0;margin-left: 5px;font-family: Verdana;">删除</button></td></tr>`;
                const  tableValue = document.getElementById("brandTable")
                if (tableValue){
                    tableValue.innerHTML = tableData;
                }
            }
        })
    }

    function deleteBrand(id){
        axios({
            method: "delete",
            url: "http://localhost:8080/deleteBrand/" + id
        }).then(function (response) {
            if (response.status === 200) {
                alert("删除成功");
                getBrandList(); // 重新加载品牌列表
            } else {
                alert("删除失败");
            }
        }).catch(function (error) {
            console.log(error);
            alert("删除失败");
        });
    }

    document.getElementById("addButton").onclick = function (){
        location.href = "brandInfo.html"
    }
</script>
<style>
    .responseTable {
        width: 95%;
        overflow: hidden;
        background: #FFF;
        color: #024457;
        border-radius: 10px;
        border: 1px solid #167F92;
    }

    .responseTable tr {
        border: 1px solid #D9E4E6;
    }

    .responseTable tr:nth-child(odd) {
        background-color: #EAF3F3;
    }

    .responseTable th {
        display: none;
        border: 1px solid #FFF;
        background-color: #167F92;
        color: #FFF;
        padding: 1em;
    }

    .responseTable th:first-child {
        display: table-cell;
        text-align: center;
    }

    .responseTable th:nth-child(2) {
        display: table-cell;
    }

    .responseTable th:nth-child(2) span {
        display: none;
    }

    .responseTable th:nth-child(2):after {
        content: attr(data-th);
    }

    @media (min-width: 480px) {
        .responseTable th:nth-child(2) span {
            display: block;
        }

        .responseTable th:nth-child(2):after {
            display: none;
        }
    }

    .responseTable td {
        display: block;
        word-wrap: break-word;
        max-width: 7em;
    }

    .responseTable td:first-child {
        display: table-cell;
        text-align: center;
        border-right: 1px solid #D9E4E6;
    }

    @media (min-width: 480px) {
        .responseTable td {
            border: 1px solid #D9E4E6;
        }
    }

    .responseTable th, .responseTable td {
        text-align: left;
        margin: .5em 1em;
    }

    @media (min-width: 480px) {
        .responseTable th, .responseTable td {
            display: table-cell;
            padding: 1em;
        }
    }

    /*body {*/
    /*        padding: 0 2em;*/
    /*        font-family: Arial, sans-serif;*/
    /*        color: #024457;*/
    /*        background: #f2f2f2;*/
    /*    }*/

    h1,button {
        font-family: Verdana;
        font-weight: normal;
        color: #024457;
    }

    h1 span,button {
        color: #167F92;
    }

    span,button {
        cursor: pointer;
    }

</style>
</body>
</html>
